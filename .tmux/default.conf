source-file ~/.tmux.conf

send-keys 'btop' C-m
new-window
split-window -h -p 60
select-pane -t 1
split-window -v -p 45
send-keys ' servercheck' C-m
select-pane -t 3
# send-keys ' hotspot CA' C-m
# send-keys ' nu' C-m
# send-keys ' mullvad connect; sleep 3s;mullvad status' C-m
send-keys ' mullvad connect && sleep 3s && mullvad status' C-m
rename-session "Default-#S"
send-keys ' sleep 3s && curl -s ipinfo.io' C-m
